<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Desk — Angkor Travel</title>
<link rel="icon" type="image/webp" href="logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@1/dist/umd/lucide.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #0b1f1c; color: #0f172a; }
  .bubble-ai { background: #e7f6f3; border-radius: 4px 16px 16px 16px; }
  .bubble-agent { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 4px 16px 16px 16px; }
  .bubble-me { background: #0f172a; color: #fff; border-radius: 16px 4px 16px 16px; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .fade { animation: fadeUp .35s ease; }
  @keyframes typingBlink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .pulse-dot { animation: pulse 2s infinite; }
  .guest-card.active { background: #f0fdfa; border-color: #0d9488; }
  .conn-on { background: #dcfce7; color: #15803d; }
  .conn-off { background: #fee2e2; color: #b91c1c; }
  html[lang="km"] body { font-family: 'Noto Sans Khmer', 'DM Sans', sans-serif; }
</style>
</head>
<body>

<div class="max-w-6xl mx-auto p-4 md:p-6 min-h-screen flex flex-col">

  <!-- Header -->
  <div class="flex items-center justify-between mb-4 text-white">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-white p-1.5 shadow flex items-center justify-center">
        <img src="logo.webp" alt="Angkor Travel" class="w-full h-full object-contain bg-white rounded-xl">
      </div>
      <div>
        <div class="text-[11px] uppercase tracking-widest opacity-70">Angkor Travel</div>
        <h2 class="text-[22px] font-semibold" style="font-family:'Fraunces',serif">Agent Desk</h2>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-[12px] font-bold" id="connStatus">
        <span class="w-2 h-2 rounded-full pulse-dot" style="background:#15803d"></span>
        <span id="connLabel">Connected</span>
      </div>
      <select id="langSel" class="px-3 py-1.5 rounded-lg bg-white text-slate-900 text-[13px] font-semibold outline-none border-0">
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="km">ខ្មែរ</option>
      </select>
    </div>
  </div>

  <!-- Connection note -->
  <div class="rounded-xl px-3 py-2 mb-3 text-[11.5px] flex items-center gap-2" id="connNote" style="background:rgba(255,255,255,.06);color:rgba(255,255,255,.7)">
    <span style="font-size:14px">📡</span>
    <span id="connNoteText">Same-browser mode: messages sync across tabs. Open this page in another tab/window to chat with the customer app.</span>
  </div>

  <!-- Main grid -->
  <div class="grid md:grid-cols-[240px_1fr_280px] gap-3 flex-1" style="min-height:0">

    <!-- Inbox -->
    <div class="bg-white rounded-2xl overflow-hidden flex flex-col">
      <div class="px-3 py-3 border-b flex items-center justify-between" style="border-color:rgba(15,23,42,.06)">
        <span class="text-[12px] font-bold text-slate-500 uppercase">Inbox</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full" id="inboxCount" style="background:#fef3c7;color:#b45309">0</span>
      </div>
      <div id="deskList" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
    </div>

    <!-- Chat -->
    <div class="bg-white rounded-2xl overflow-hidden flex flex-col">
      <div class="px-4 py-3 border-b flex items-center justify-between" style="border-color:rgba(15,23,42,.06)">
        <div class="min-w-0">
          <div class="font-semibold text-[14px] truncate" id="deskGuest">—</div>
          <div class="text-[11px] text-slate-400 truncate" id="deskMeta">Select a customer from inbox</div>
        </div>
        <div class="text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1" id="custOnline" style="background:#fef3c7;color:#b45309">
          <span class="w-1.5 h-1.5 rounded-full pulse-dot" style="background:#b45309"></span> <span id="custOnlineLabel">Offline</span>
        </div>
      </div>
      <div id="deskLog" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
      <div class="p-3 border-t flex gap-2" style="border-color:rgba(15,23,42,.06)">
        <input id="deskIn" class="flex-1 px-3.5 py-2.5 rounded-xl border text-[13.5px] outline-none" style="border-color:rgba(15,23,42,.1);background:#fbfdfc" placeholder="Type a reply to this customer..." disabled>
        <button id="deskSendBtn" class="px-4 rounded-xl text-white font-bold text-[13px] flex items-center gap-1.5" style="background:#0f172a;opacity:.5" disabled>
          <i data-lucide="send" style="width:16px;height:16px"></i> Send
        </button>
      </div>
    </div>

    <!-- Customer profile -->
    <div class="bg-white rounded-2xl overflow-hidden flex flex-col">
      <div class="px-3 py-3 border-b text-[12px] font-bold text-slate-500 uppercase" style="border-color:rgba(15,23,42,.06)">Customer profile</div>
      <div id="deskProfile" class="flex-1 overflow-y-auto p-3 text-[13px]"></div>
    </div>

  </div>
</div>
